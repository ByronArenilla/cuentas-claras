# Configuración de Alembic para la línea de comandos (spec 008, ADR 0011).
#
# La API NO lee este archivo: arma su configuración en código y aplica las
# migraciones al arrancar (app/db.py, run_migrations). Este archivo solo sirve
# para crear migraciones nuevas durante el desarrollo, desde services/api:
#
#   set -a; . ../../.env; set +a
#   .venv/bin/alembic revision --autogenerate --rev-id 0004 -m "que cambia"
#
# Revisa siempre el archivo generado: autogenerate es un borrador, no una
# migración terminada (por ejemplo, no sabe convertir datos).

[alembic]
# Dónde están env.py, la plantilla y la carpeta versions/. %(here)s es la
# carpeta de este archivo, así funciona desde cualquier directorio.
script_location = %(here)s/app/migrations

# Nombre de cada archivo nuevo: 0004_que_cambia.py (sin fecha ni hash).
file_template = %%(rev)s_%%(slug)s
